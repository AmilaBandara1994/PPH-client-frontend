<div class="tablesection">

</div>


<div class="container">
  <div class="tabl" [ngStyle]="{ display:displyby === 'table'?  'unset' : 'none' } ">
    <mat-table [dataSource]="data">
      <ng-container *ngFor="let column of columns; let i = index;" [matColumnDef]="column">
        <mat-header-cell *matHeaderCellDef> {{ headers[i] }} </mat-header-cell>
        <mat-cell *matCellDef="let element"> {{ element[binders[i]] }} </mat-cell>
      </ng-container>
      <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: columns;"></mat-row>
    </mat-table>
  </div>
  <div class="pie" [ngStyle]="{ display:displyby === 'pie'?  'unset' : 'none' } ">
    <div #piechart></div>

  </div>
  <div class="bar" [ngStyle]="{ display:displyby === 'bar'?  'unset' : 'none' } ">
    <div #barchart></div>

  </div>
  <div class="line" [ngStyle]="{ display:displyby === 'line'?  'unset' : 'none' } ">
    <div #linechart></div>

  </div>
</div>
